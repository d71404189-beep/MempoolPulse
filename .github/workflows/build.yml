name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rust unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all --no-fail-fast

  frontend:
    name: Frontend build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [test, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libayatana-appindicator3-dev
      - run: npm ci
      - name: Sync version from tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "$TAG" | sed 's/^v//' | sed 's/-.*//')
          echo "Setting version to $VERSION"
          cat > /tmp/sync_version.py << HEREDOC
import re, sys
v = sys.argv[1]
with open('src-tauri/tauri.conf.json', 'r') as f:
    c = f.read()
c = re.sub(r'"version": "[^"]+"', f'"version": "{v}"', c)
with open('src-tauri/tauri.conf.json', 'w') as f:
    f.write(c)
with open('src-tauri/Cargo.toml', 'r') as f:
    c = f.read()
c = re.sub(r'^version = "[^"]+"', f'version = "{v}"', c, count=1, flags=re.MULTILINE)
with open('src-tauri/Cargo.toml', 'w') as f:
    f.write(c)
print('Done:', v)
HEREDOC
          python3 /tmp/sync_version.py "$VERSION"
          grep '"version"' src-tauri/tauri.conf.json
      - name: Tauri build
        env:
          GUMROAD_PRODUCT_PERMALINK: ${{ vars.GUMROAD_PRODUCT_PERMALINK }}
        run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            !**/*.txt

  release:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Collect installer files
        run: |
          mkdir release_files
          find bundles -type f \( \
            -name "*.exe" \
            -o -name "*.dmg" \
            -o -name "*.deb" \
            -o -name "*.AppImage" \
          \) -exec cp {} release_files/ \;
          ls release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MempoolPulse ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
